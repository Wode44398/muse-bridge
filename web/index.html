<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<!-- interactive-widget=resizes-content：键盘弹出时强制收缩 layout viewport（Chromium 108+），
     钉底的输入条随视口底边抬升。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#1f1f1e" />
<title>Muse Bridge</title>
<!-- PWA: add-to-home-screen on Android (manifest) and iOS (apple-* meta + apple-touch-icon).
     %BASE_URL% resolves to '/' in dev and '/app/' in the production build. -->
<link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Muse Bridge" />
<link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
<link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
<link rel="icon" href="%BASE_URL%icons/favicon-32.png" sizes="32x32" type="image/png" />
<!-- Early theme binding: set data-theme before first paint so there's no flash.
     Default dark; light is a complete second theme. -->
<script>(function(){try{var t=localStorage.getItem('bridge-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
