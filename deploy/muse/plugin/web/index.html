<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安卓 App</title>
<link rel="stylesheet" href="/plugins/_sdk/bridge-plugin.css">
<style>
  .qr { display: flex; justify-content: center; padding: 14px 0 6px; }
  .qr svg { width: 168px; height: 168px; background: #fff; border-radius: 10px; padding: 6px; }
  .foot { font-size: 12.5px; line-height: 1.6; padding: 6px 4px 0; margin: 0; }
  .val { color: var(--bp-muted); font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<!-- 设置 · 安卓 App（Muse 插件的面板）。App 是个在线 WebView 壳（源码在 android/），界面就是这个网页，随服务器更新。
     在 App 里：显示 App 版本、「更换服务器地址」（交给原生面板；要 App 把 MuseBridgeApp 注入到面板这一层，拿不到就不显示）。
     安卓浏览器里：下载 + 「在 App 里打开」（intent 把服务器地址带进 App，没装就落到下载）。电脑上：二维码，手机扫了直接下载。 -->
<div class="bp-page">
  <div class="bp-section" id="phone" hidden>
    <div class="bp-section-title" data-t="这台手机"></div>
    <div class="bp-group">
      <div class="bp-row"><div class="bp-row-main"><div class="bp-row-title" data-t="安卓 App"></div><div class="bp-row-desc" data-t="界面由服务器提供，服务器更新后这里自动就是新版"></div></div><span class="val" id="appVer">—</span></div>
      <div class="bp-row"><div class="bp-row-main"><div class="bp-row-title" data-t="服务器地址"></div><div class="bp-row-desc" data-t="临时地址变了，或者想连另一台 Muse，在这里换"></div></div><button class="bp-btn" id="change" data-t="更换"></button></div>
      <div class="bp-row" id="updRow" hidden><div class="bp-row-main"><div class="bp-row-title" data-t="App 有新版本"></div><div class="bp-row-desc meta"></div></div><button class="bp-btn bp-btn-primary dl" data-t="下载"></button></div>
    </div>
  </div>
  <div class="bp-section" id="get" hidden>
    <div class="bp-section-title" data-t="安卓 App"></div>
    <div class="bp-group">
      <div class="bp-row"><div class="bp-row-main"><div class="bp-row-title" data-t="下载 apk"></div><div class="bp-row-desc meta"></div></div><button class="bp-btn bp-btn-primary dl" data-t="下载"></button></div>
      <div class="bp-row" id="openRow" hidden><div class="bp-row-main"><div class="bp-row-title" data-t="在 App 里打开"></div><div class="bp-row-desc" data-t="装好之后点这里，App 会自动填好现在这个地址"></div></div><button class="bp-btn" id="open" data-t="打开"></button></div>
      <div class="bp-row"><div class="bp-row-main"><div class="bp-row-title" data-t="GitHub 发布页"></div><div class="bp-row-desc" data-t="每个版本的 apk 也都挂在这里"></div></div><button class="bp-btn" id="gh" data-t="打开"></button></div>
    </div>
    <div class="qr" id="qr" hidden></div>
    <p class="bp-muted foot" data-t="App 只是把这个网页装进一个独立窗口：从桌面图标直接打开、记住服务器地址，临时地址变了可以在 App 里直接换。界面和网页版完全一样，随服务器自动更新。没有 iPhone App：在 Safari 里「添加到主屏幕」即可。"></p>
  </div>
</div>
<script type="module">
  import { bridge } from '/plugins/_sdk/bridge-plugin.js';
  const EN = {
    '这台手机': 'This phone', '安卓 App': 'Android app', '界面由服务器提供，服务器更新后这里自动就是新版': 'The interface comes from your server and updates with it',
    '服务器地址': 'Server address', '临时地址变了，或者想连另一台 Muse，在这里换': 'Change it here if the temporary address changed or you want another Muse',
    '更换': 'Change', 'App 有新版本': 'App update available', '下载': 'Download', '下载 apk': 'Download the apk',
    '在 App 里打开': 'Open in the app', '装好之后点这里，App 会自动填好现在这个地址': 'After installing, tap here and the app fills in this address',
    'GitHub 发布页': 'GitHub releases', '每个版本的 apk 也都挂在这里': 'Every version’s apk is also there', '打开': 'Open',
    'App 只是把这个网页装进一个独立窗口：从桌面图标直接打开、记住服务器地址，临时地址变了可以在 App 里直接换。界面和网页版完全一样，随服务器自动更新。没有 iPhone App：在 Safari 里「添加到主屏幕」即可。':
      'The app puts this web page in its own window: open it from the home screen, it remembers the server address, and you can switch when a temporary address changes. The interface is the same as the web version and updates with your server. There is no iPhone app: use “Add to Home Screen” in Safari.',
    '从 GitHub 下载最新版': 'Download the latest from GitHub', '版本 {v} · {kb} KB': 'Version {v} · {kb} KB',
  };
  const RELEASES = 'https://github.com/Wode44398/muse-bridge/releases/latest';
  const $ = (id) => document.getElementById(id);
  const ready = await bridge.ready();
  const en = ready.lang === 'en';
  const t = (s, p) => (en && EN[s] ? EN[s] : s).replace(/\{(\w+)\}/g, (m, k) => (p && p[k] != null ? String(p[k]) : m));
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t);
  document.documentElement.lang = en ? 'en' : 'zh-CN';

  // App 把原生接口注入到每一层页面时才拿得到；拿不到就当普通浏览器
  let app = null;
  try { app = window.MuseBridgeApp || null; } catch { app = null; }
  const ua = navigator.userAgent || '';
  const android = /Android/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  let info = { available: false };
  try { info = await bridge.json('android'); } catch {}
  const kb = Math.max(1, Math.round((info.size || 0) / 1024));
  const meta = !info.available ? t('从 GitHub 下载最新版') : info.versionName ? t('版本 {v} · {kb} KB', { v: info.versionName, kb }) : `${kb} KB`;
  for (const el of document.querySelectorAll('.meta')) el.textContent = meta;
  const download = () => { if (info.download) bridge.openExternal(info.download); };
  for (const el of document.querySelectorAll('.dl')) el.onclick = download;

  if (app) {
    $('phone').hidden = false;
    let code = 0;
    try { $('appVer').textContent = String(app.versionName() || '—'); code = Number(app.versionCode()) || 0; } catch {}
    $('updRow').hidden = !(info.available && code > 0 && info.versionCode > code);
    $('change').onclick = () => { try { app.changeServer(); } catch {} };
  } else {
    $('get').hidden = false;
    $('gh').onclick = () => bridge.openExternal(RELEASES);
    if (android && info.origin) {
      $('openRow').hidden = false;
      // 插件页只能开 http(s)：开插件自己的跳转页，由它跳 intent://（装了 App 就把服务器地址带进去，没装就落到下载）
      $('open').onclick = () => bridge.openExternal(info.origin + '/muse/open-app');
    }
    if (!android && !ios && info.qr) { $('qr').innerHTML = info.qr; $('qr').hidden = false; }
  }
</script>
</body>
</html>
